name: Open source daily snapshot

on:
  schedule:
    - cron: '23 8 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-source-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout de rama principal
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Ejecutar pruebas antes de publicar
        run: python -m unittest discover -s tests -v

      - name: Obtener datos públicos reales
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: python src/monitor.py

      - name: Publicar commits automáticos con cambios reales
        shell: bash
        env:
          AUTO_AUTHOR_NAME: ${{ vars.AUTO_AUTHOR_NAME }}
          AUTO_AUTHOR_EMAIL: ${{ vars.AUTO_AUTHOR_EMAIL }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python src/publish.py "$(date -u +%F)" "$DEFAULT_BRANCH"
